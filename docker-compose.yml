services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: audio_analyzer_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-audio_analyzer}
    # Host port 5432 is usually taken by a local PostgreSQL service;
    # expose Docker DB on host 5433. Backend still connects via db:5432 (internal).
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-audio_analyzer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis (unused by the current backend code, kept for optional Celery)
  redis:
    image: redis:7-alpine
    container_name: audio_analyzer_redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: audio_analyzer_backend
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      REDIS_URL: redis://redis:6379/0
      AUDIO_STORAGE_PATH: ./audio_collection
      ARCHIVE_DIR: ./archives
      TEMP_DIR: ./temp
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./archives:/app/archives
      - ./temp:/app/temp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Next.js Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: audio_analyzer_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
